<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام المحاسبة والمخازن</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 15px; direction: rtl; }
    
    /* Login Screen */
    #loginScreen {
      max-width: 380px; margin: 80px auto; padding: 24px; background: var(--card-bg);
      border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 14px;
    }
    #loginScreen h2 { text-align: center; margin-bottom: 10px; color: var(--primary); }

    /* App Layout */
    #appShell { display: none; flex-direction: column; gap: 16px; max-width: 1200px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 12px 20px; border-radius: 8px; border: 1px solid var(--border); }
    nav#navMain { display: flex; gap: 8px; flex-wrap: wrap; background: var(--card-bg); padding: 10px; border-radius: 8px; border: 1px solid var(--border); }
    #subbar { display: flex; gap: 8px; background: #eff6ff; padding: 8px 12px; border-radius: 6px; }
    
    /* UI Components */
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .cardHead { margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 13px; font-weight: 600; }
    
    input, select, button { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; outline: none; }
    input:focus, select:focus { border-color: var(--primary); }
    
    .btn { background: var(--primary); color: white; border: none; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: var(--primary-hover); }
    .btn.secondary { background: #64748b; }
    .btn.danger { background: #ef4444; }

    /* Table Styles */
    .tableWrap { overflow-x: auto; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; text-align: right; font-size: 14px; }
    th, td { padding: 10px; border-bottom: 1px solid var(--border); }
    th { background: #f1f5f9; }
    td.empty { text-align: center; color: #94a3b8; padding: 20px; }

    /* Modal & Toast */
    #toast { position: fixed; bottom: 20px; left: 20px; background: #0f172a; color: white; padding: 10px 18px; border-radius: 6px; display: none; z-index: 99; }
    .modalOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 50; }
    .modalBox { background: white; border-radius: 8px; width: 90%; max-width: 600px; max-height: 85vh; overflow-y: auto; padding: 20px; }
  </style>
</head>
<body>

  <!-- شاشة تحميل مؤقتة أثناء الاتصال بـ Firebase -->
  <div id="loadingScreen" style="text-align:center; margin-top:120px; color:#64748b; font-size:15px;">
    جاري الاتصال بقاعدة البيانات السحابية...
  </div>

  <!-- شاشة تسجيل الدخول -->
  <div id="loginScreen" style="display:none;">
    <h2>تسجيل الدخول</h2>
    <div class="field">
      <label>اسم المستخدم</label>
      <input type="text" id="liUser" placeholder="admin" value="admin">
    </div>
    <div class="field">
      <label>كلمة المرور</label>
      <input type="password" id="liPass" placeholder="admin123" value="admin123">
    </div>
    <button class="btn" onclick="doLogin()">دخول للنظام</button>
    <span id="liErr" style="color:#ef4444; font-size:13px; text-align:center;"></span>
  </div>

  <!-- واجهة التطبيق الرئيسية -->
  <div id="appShell">
    <div class="header">
      <h3>برنامج المحاسبة والمخازن</h3>
      <div id="userBox"></div>
    </div>
    <nav id="navMain"></nav>
    <div id="subbar" style="display:none;"></div>
    <div id="content"></div>
  </div>

  <!-- التنبيهات والنافذة المنبثقة -->
  <div id="toast"></div>
  <div id="modalRoot"></div>

  <!-- استدعاء المكتبات الخارجية للكتابة إلى Excel إذا لزم الأمر -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- مكتبات Firebase (النسخة compat — أبسط استخدام بدون أدوات بناء/npm) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <!-- استدعاء الملف البرمجي الرئيسي -->
  <script src="js/app.js"></script>
</body>
</html>
