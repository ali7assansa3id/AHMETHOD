<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AHMETHOD — Smart Accounting &amp; Business Management</title>
<link rel="stylesheet" href="./css/style.css">
<!-- SheetJS (Excel import/export) -->
<script src="./libs/xlsx.full.min.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';"></script>

<!-- 1. استدعاء مكتبات Firebase السحابية الجاهزة للمتصفح -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
  // 2. إعداد بيانات الاتصال الخاصة بمشروعك (ahmethodpro)
  const firebaseConfig = {
    apiKey: "AIzaSyCnuv-hBxucSgRN-_SD0i6jx3Xv7CR_gQU",
    authDomain: "ahmethodpro.firebaseapp.com",
    databaseURL: "https://ahmethodpro-default-rtdb.firebaseio.com", // إذا كان رابط قاعدة البيانات مختلفاً في حسابك فاستبدله هنا
    projectId: "ahmethodpro",
    storageBucket: "ahmethodpro.firebasestorage.app",
    messagingSenderId: "545312965626",
    appId: "1:545312965626:web:94eb7366be72a6dc965a43",
    measurementId: "G-L542GK25F0"
  };

  // 3. تهيئة الاتصال بـ Firebase وتوفيره للمشروع
  firebase.initializeApp(firebaseConfig);
  window.db = firebase.database();
</script>
</head>
<body>

<div id="loginScreen">
  <div class="loginBox">
    <h1>AHMETHOD</h1>
    <p>Smart Accounting &amp; Business Management — سجّل الدخول للمتابعة</p>
    <input id="liUser" placeholder="اسم المستخدم" autocomplete="username">
    <input id="liPass" type="password" placeholder="كلمة السر" autocomplete="current-password">
    <button class="btn" onclick="platformDoLogin()">دخول</button>
    <div class="loginErr" id="liErr"></div>
    <button class="linkBtn" onclick="openRegisterModal()">+ إنشاء حساب / شركة جديدة</button>

  </div>
</div>

<div id="subExpiredScreen">
  <div class="loginBox">
    <h1>⚠️ <span id="subExpiredMsg">انتهى اشتراكك</span></h1>
    <p>الشركة: <b id="subExpiredCompanyName"></b></p>
    <p>تاريخ انتهاء الاشتراك: <b id="subExpiredEnd"></b></p>
    <p style="color:var(--muted);font-size:12px;">للتجديد أو الاستفسار يرجى التواصل مع الدعم الفني، أو تواصل مدير النظام (Super Admin) لتفعيل الاشتراك.</p>
    <button class="btn secondary" onclick="backToLoginFromExpired()">رجوع لتسجيل الدخول</button>
  </div>
</div>

<div id="superAdminShell"></div>

<div id="appShell">
  <div id="topbar"><span class="brand">📒 نظام الحسابات</span><div id="navMain" style="display:flex;gap:4px;"></div><div id="userBox"></div></div>
  <div id="subbar"></div>
  <div id="content"></div>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<!-- 4. استدعاء ملفات المشروع بالترتيب -->
<script src="./js/app.js"></script>
<script src="./js/utils.js"></script>
<script src="./js/storage.js"></script>
<script src="./js/permissions.js"></script>
<script src="./js/users.js"></script>
<script src="./js/companies.js"></script>
<script src="./js/auth.js"></script>
</body>
</html>
